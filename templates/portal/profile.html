{% extends 'base.html' %}{% block title %}Profile | NammaBiz{% endblock %}{% block content %}
<main class="shell page"><div class="page-head"><p class="eyebrow">ACCOUNT</p><h1>Profile</h1>{% if current_user.profile_photo_name %}<img class="profile-photo" src="/profile-photos/{{ current_user.id }}" alt="Profile photo">{% endif %}</div><section class="form-panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" value="{{ current_user.name }}" required maxlength="120"></label><label>Email<input value="{{ current_user.email }}" disabled></label><label>Mobile<input name="mobile" value="{{ current_user.mobile }}" maxlength="32"></label><label>Profile photo<input name="profile_photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="button dark">Save profile</button></form></section></main>{% endblock %}
