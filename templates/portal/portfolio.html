{% extends 'base.html' %}{% block title %}Portfolio | NammaBiz{% endblock %}{% block content %}<main class="shell page"><div class="page-head"><p class="eyebrow">CONTRACTOR PROFILE</p><h1>Portfolio</h1></div><section class="form-panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Project title<input name="title" required maxlength="120"></label><label>Description<textarea name="description" maxlength="500"></textarea></label><label>Image<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label><button class="button dark">Add project</button></form></section>{% for item in items %}<article class="market-row"><div><h2>{{ item.title }}</h2><p>{{ item.description }}</p><small>{{ item.created_at }}</small></div></article>{% else %}<p class="subtle">No portfolio projects yet.</p>{% endfor %}</main>{% endblock %}
