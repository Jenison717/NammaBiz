{% extends 'base.html' %}{% block title %}New service request | NammaBiz{% endblock %}{% block content %}
<main class="shell page"><div class="page-head"><p class="eyebrow">SERVICE REQUEST</p><h1>Tell contractors what you need.</h1></div><section class="form-panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Service<select name="service_id" required>{% for service in services %}<option value="{{ service.id }}" {% if selected_service_id == service.id %}selected{% endif %}>{{ service.category.name }} / {{ service.name }}</option>{% endfor %}</select></label><label>Description<textarea name="description" required maxlength="5000" rows="5"></textarea></label><div class="form-grid"><label>Location<input name="location" required maxlength="240" placeholder="Area, city"></label><label>Preferred date and time<input name="preferred_at" type="datetime-local"></label><label>Budget (optional)<input name="budget" type="number" min="1" step="0.01"></label><label>Urgency<select name="urgency"><option value="NORMAL">Normal</option><option value="LOW">Flexible</option><option value="URGENT">Urgent</option></select></label></div><label>Additional requirements<textarea name="requirements" maxlength="3000" rows="3"></textarea></label><label>Photos<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><small>Up to 4 images. Maximum request size is 8 MB.</small><button class="button dark">Send request</button></form></section></main>{% endblock %}
