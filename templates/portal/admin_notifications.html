{% extends 'base.html' %}{% block title %}Admin notifications | NammaBiz{% endblock %}{% block content %}<main class="shell page"><div class="page-head"><p class="eyebrow">ADMIN / COMMUNICATIONS</p><h1>In-app notifications</h1></div><section class="form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Recipient<select name="user_id"><option value="">All active accounts</option>{% for user in users %}<option value="{{ user.id }}">{{ user.name }} · {{ user.email }} · {{ user.role }}</option>{% endfor %}</select></label><label>Message<textarea name="message" required maxlength="500"></textarea></label><button class="button dark">Send notification</button></form></section></main>{% endblock %}
