{% extends 'base.html' %}{% block title %}Initial setup | NammaBiz{% endblock %}{% block content %}
<main class="shell page auth-page"><section class="auth-panel"><p class="eyebrow">FIRST-RUN SETUP</p><h1>Create the platform admin</h1><p>This one-time setup is available only from this computer in development. Production admin accounts are created through the deployment CLI.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Admin name<input name="name" autocomplete="name" maxlength="120" required></label><label>Admin email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>Platform fee percentage<input name="platform_fee_percent" type="number" min="0" max="100" step="0.01" value="0" required></label><button class="button dark">Complete setup</button></form></section></main>
{% endblock %}
