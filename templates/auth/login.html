{% extends 'base.html' %}{% block title %}Sign in | NammaBiz{% endblock %}{% block content %}
<main class="shell page auth-page"><section class="auth-panel"><p class="eyebrow">YOUR NAMMABIZ ACCOUNT</p><h1>Sign in</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label class="check-row"><input type="checkbox" name="remember" value="1"> Keep me signed in</label><button class="button dark">Sign in</button></form><p><a href="/auth/forgot">Forgot password?</a></p><p>New to NammaBiz? <a href="/auth/register">Create a customer account</a> or <a href="/auth/register/contractor">join as a contractor</a>.</p></section></main>{% endblock %}
