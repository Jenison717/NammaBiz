services:
  - type: web
    name: nammabiz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && AUTO_CREATE_DB=false flask --app wsgi:application db upgrade
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nammabiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: AUTO_CREATE_DB
        value: false
      - key: SEED_SAMPLE_DATA
        value: false
      - key: ADMIN_EMAIL
        value: jenison717@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: NammaBiz Admin

databases:
  - name: nammabiz-db
    databaseName: nammabiz
    user: nammabiz
    plan: free
